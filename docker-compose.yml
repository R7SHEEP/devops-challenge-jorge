version: "3.9"

services:
  api1:
    build: .
    container_name: devops-api-1
    expose:
      - "8000"

  api2:
    build: .
    container_name: devops-api-2
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    container_name: devops-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2